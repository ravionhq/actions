name: Setup Terraform
description: Install a specific version of Terraform

inputs:
  terraform-version:
    description: Terraform version to install
    required: false
    default: "1.6.6"

dependencies:
  - name: unzip
    package: unzip

dependencyTemplates:
  - name: terraform
    version: ${{ inputs.terraform-version }}
    installMethod: binary-download
    checkBinary: terraform
    # checkBinary alone ignores the version, so a kept disk would keep an old one
    verificationCommand: '[ "$(terraform version | head -n1)" = "Terraform v${{ inputs.terraform-version }}" ]'
    binaryDownload:
      url: https://releases.hashicorp.com/terraform/${{ inputs.terraform-version }}/terraform_${{ inputs.terraform-version }}_linux_$ARCH.zip
      archiveFormat: zip
      binaryPath: terraform
      installPath: /usr/local/bin
      executableName: terraform

instructions: []
