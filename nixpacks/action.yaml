name: Nixpacks Setup
description: Install Nixpacks binary and setup environment for building

inputs:
  nixpacks-version:
    description: Nixpacks version to install
    required: false
    default: 1.41.0

dependencies:
  # Keep postInstall in sync with docker/action.yaml: if this action installs
  # docker first, the docker action's dependency check will see the binary and
  # skip its own postInstall, so the daemon must be started here too.
  - name: docker
    checkBinary: docker
    verificationCommand: sudo docker info
    postInstall:
      - sudo systemctl daemon-reload
      - sudo systemctl start docker
      - sudo systemctl enable docker
      - sudo usermod -aG docker $USER || true

  - name: aws-cli
    package: awscli
    checkBinary: aws

  - name: curl
    package: curl
    checkBinary: curl

  - name: tar
    package: tar
    checkBinary: tar

dependencyTemplates:
  - name: nixpacks
    version: ${{ inputs.nixpacks-version }}
    installMethod: binary-download
    checkBinary: nixpacks
    # checkBinary alone ignores the version, so a kept disk would keep an old one
    verificationCommand: '[ "$(nixpacks --version)" = "nixpacks ${{ inputs.nixpacks-version }}" ]'
    binaryDownload:
      url: https://github.com/railwayapp/nixpacks/releases/download/v${{ inputs.nixpacks-version }}/nixpacks-v${{ inputs.nixpacks-version }}-x86_64-unknown-linux-gnu.tar.gz
      archiveFormat: tar.gz
      binaryPath: nixpacks
      installPath: /usr/local/bin
      executableName: nixpacks
      permissions: "755"

instructions:
  # Verify Nixpacks installation
  - type: command
    command: |
      echo "Verifying Nixpacks installation..."
      nixpacks --version
      echo "Nixpacks successfully installed"
