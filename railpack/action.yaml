name: Railpack Setup
description: Install Railpack binary and setup environment for building

inputs:
  railpack-version:
    description: Railpack version to install
    required: false
    default: "0.29.0"

dependencies:
  - name: docker
    package: docker.io
    alternativePackages:
      - docker
    checkBinary: dockerd
    postInstall:
      - sudo usermod -aG docker $USER || true

  - name: curl
    package: curl
    checkBinary: curl

  - name: tar
    package: tar
    checkBinary: tar

services:
  - name: docker
    command: dockerd
    ready: sudo docker info
    systemdUnit: docker

dependencyTemplates:
  - name: railpack
    version: ${{ inputs.railpack-version }}
    installMethod: binary-download
    checkBinary: railpack
    binaryDownload:
      url: https://github.com/railwayapp/railpack/releases/download/v${{ inputs.railpack-version }}/railpack-v${{ inputs.railpack-version }}-$ARCH.tar.gz
      archiveFormat: tar.gz
      binaryPath: railpack
      installPath: /usr/local/bin
      executableName: railpack
      permissions: "755"
      architectureSpecific:
        amd64: x86_64-unknown-linux-musl
        arm64: arm64-unknown-linux-musl

instructions:
  - type: command
    command: |
      echo "Verifying Railpack installation..."
      railpack --version
      echo "Railpack successfully installed"
