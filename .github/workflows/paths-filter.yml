name: Paths filter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'paths-filter/**'
      - '.github/workflows/paths-filter.yml'
  push:
    branches: [main]
    paths:
      - 'paths-filter/**'
      - '.github/workflows/paths-filter.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paths-filter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: paths-filter/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run format-check
      - run: npm run lint
      - run: npm run pack
      - name: Check bundle reproducibility
        run: git diff --exit-code -- dist/index.js
