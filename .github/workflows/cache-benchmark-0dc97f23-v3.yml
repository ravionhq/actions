{
  "name": "Cache benchmark v3 / round 1",
  "on": {
    "push": {
      "branches": [
        "devin/1791582000-cache-download-benchmark"
      ],
      "paths": [
        ".github/workflows/cache-benchmark-0dc97f23-v3.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "cache-benchmark-0dc97f23-v3",
    "cancel-in-progress": false
  },
  "jobs": {
    "github": {
      "name": "restore (github, 1)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 8,
      "env": {
        "BENCH_PROVIDER": "github",
        "BENCH_REP": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "ravionhq/actions",
            "ref": "7b036e5a5e085f5e38a7cce3c9355e38440eaa21",
            "persist-credentials": false
          }
        },
        {
          "name": "Pin zstd outside timing",
          "run": "bash .github/scripts/cache-benchmark-tools.sh"
        },
        {
          "name": "Machine and empty-destination evidence",
          "run": "python3 .github/scripts/cache-benchmark-fixture.py machine\npython3 .github/scripts/cache-benchmark-fixture.py empty"
        },
        {
          "name": "Restore small",
          "id": "small",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "env": {
            "NODE_OPTIONS": "--require=${{ github.workspace }}/.github/scripts/cache-benchmark-observe.cjs",
            "BENCH_FIXTURE": "small",
            "BENCH_MODE": "restore"
          },
          "with": {
            "path": ".cache-benchmark-0dc97f23-v3/small",
            "key": "cb-0dc97f23-v3-github-small",
            "fail-on-cache-miss": true
          }
        },
        {
          "name": "Verify exact hit and bytes small",
          "env": {
            "HIT": "${{ steps.small.outputs.cache-hit }}"
          },
          "run": "test \"$HIT\" = true\npython3 .github/scripts/cache-benchmark-fixture.py verify small"
        },
        {
          "name": "Restore medium",
          "id": "medium",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "env": {
            "NODE_OPTIONS": "--require=${{ github.workspace }}/.github/scripts/cache-benchmark-observe.cjs",
            "BENCH_FIXTURE": "medium",
            "BENCH_MODE": "restore"
          },
          "with": {
            "path": ".cache-benchmark-0dc97f23-v3/medium",
            "key": "cb-0dc97f23-v3-github-medium",
            "fail-on-cache-miss": true
          }
        },
        {
          "name": "Verify exact hit and bytes medium",
          "env": {
            "HIT": "${{ steps.medium.outputs.cache-hit }}"
          },
          "run": "test \"$HIT\" = true\npython3 .github/scripts/cache-benchmark-fixture.py verify medium"
        }
      ]
    }
  }
}
