name: Setup Ruby
description: Install a specific Ruby version (major.minor like 3.2 or exact like 3.2.8)

inputs:
  ruby-version:
    description: Ruby version to install (major.minor like 3.2 or exact like 3.2.8)
    required: false
    default: "3.2"

dependencyTemplates:
  - name: ruby
    package: ruby
    version: ${{ inputs.ruby-version }}
    installMethod: binary-download
    verificationCommand: |
      set -euo pipefail
      R='${{ inputs.ruby-version }}'
      A="$(/usr/local/bin/ruby -e 'print RUBY_VERSION')"
      case "$A" in
        "$R"|"$R".*) ;;
        *) exit 1 ;;
      esac
      /usr/local/bin/gem --version >/dev/null
      /usr/local/bin/bundle --version >/dev/null
      ruby_bin="$(/usr/local/bin/ruby -e 'print Gem.bindir')"
      printf 'export PATH="%s:$PATH"\n' "$ruby_bin" | sudo tee /etc/profile.d/ravion-ruby.sh >/dev/null
    binaryDownload:
      url: https://raw.githubusercontent.com/ruby/setup-ruby/master/ruby-builder-versions.json
      archiveFormat: none
      installPath: /tmp
      executableName: ravion-ruby-versions.json
    postInstall:
      - |
        set -euo pipefail
        R='${{ inputs.ruby-version }}'
        . /etc/os-release
        old_dir_to_remove=
        machine="$(uname -m)"
        case "$machine" in
          x86_64) arch=x64 ;;
          aarch64) arch=arm64 ;;
          *) echo "Unsupported architecture: $machine" >&2; exit 1 ;;
        esac
        index=/tmp/ravion-ruby-versions.json
        if [ "$ID" = ubuntu ]; then
          platform="ubuntu-$VERSION_ID-$arch"
          versions="$(sed -n '/"ruby":[[:space:]]*\[/,/\]/p' "$index" | grep -oE '"[^"]+"' | tr -d '"')"
          if [[ "$R" == *-* ]]; then
            candidates="$(printf '%s\n' "$versions" | grep -Fx "$R" || true)"
          else
            pattern="$(printf '%s' "$R" | sed 's/\./\\./g')"
            candidates="$(printf '%s\n' "$versions" | grep -E "^${pattern}(\\.[0-9]+)*$" | sort -Vr || true)"
          fi
          if [ -z "$candidates" ]; then
            echo "No Ruby build matching $R was found" >&2
            exit 1
          fi
          downloaded=false
          tried=0
          while IFS= read -r v && [ "$tried" -lt 3 ]; do
            [ -n "$v" ] || continue
            tried=$((tried + 1))
            archive="/tmp/ruby-$v-$platform.tar.gz"
            url="https://github.com/ruby/ruby-builder/releases/download/ruby-$v/ruby-$v-$platform.tar.gz"
            if http_code="$(curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 \
              -o "$archive" -w '%{http_code}' "$url")"; then
              downloaded=true
              break
            elif [ "$http_code" = 404 ]; then
              rm -f "$archive"
            else
              echo "Failed to download Ruby $v (HTTP $http_code)" >&2
              exit 1
            fi
          done <<< "$candidates"
          if [ "$downloaded" != true ]; then
            echo "No Ruby build archive matching $R was found in the newest three candidates" >&2
            exit 1
          fi
          v="$(basename "$archive" "-$platform.tar.gz")"
          v="${v#ruby-}"
          if apt-cache show libreadline8t64 >/dev/null 2>&1; then
            readline=libreadline8t64
          else
            readline=libreadline8
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libyaml-0-2 libffi8 libgmp10 zlib1g libncurses6 "$readline"
          old_ruby="$(readlink -f /usr/local/bin/ruby 2>/dev/null || true)"
          case "$old_ruby" in
            /opt/hostedtoolcache/Ruby/*/bin/ruby)
              old_dir="${old_ruby%/bin/ruby}"
              old_dir="${old_dir%/*}"
              if [ "$old_dir" != "/opt/hostedtoolcache/Ruby/$v" ]; then
                old_dir_to_remove="$old_dir"
              fi
              ;;
          esac
          version_dir="/opt/hostedtoolcache/Ruby/$v"
          sudo rm -rf "$version_dir"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$version_dir"
          tar -xzf "$archive" -C "$version_dir"
          sudo chown -R "$(id -u):$(id -g)" "$version_dir"
          touch "$version_dir/$arch.complete"
          prefix="$version_dir/$arch"
          for link in /usr/local/bin/*; do
            [ -L "$link" ] || continue
            case "$(readlink "$link")" in
              /opt/hostedtoolcache/Ruby/*) sudo rm -f "$link" ;;
            esac
          done
          for file in "$prefix"/bin/*; do
            [ -e "$file" ] || continue
            sudo ln -sf "$file" "/usr/local/bin/$(basename "$file")"
          done
          rm -f "$archive"
        elif [ "$ID" = amzn ]; then
          pkg="ruby$(printf '%s' "$R" | cut -d. -f1,2)"
          if ! dnf list "$pkg" >/dev/null 2>&1; then
            available="$(dnf list available 'ruby[0-9]*' 2>/dev/null | awk '{print $1}' | sed -En 's/^(ruby[0-9]+\.[0-9]+)\..*/\1/p' | sort -Vu | paste -sd ', ' -)"
            echo "Amazon Linux 2023 has no Ruby $R package (available: $available)" >&2
            exit 1
          fi
          while IFS= read -r old_devel; do
            [ -n "$old_devel" ] || continue
            [ "$old_devel" = "$pkg-devel" ] || sudo dnf remove -y "$old_devel"
          done < <(rpm -qa --queryformat '%{NAME}\n' | grep -E '^ruby[0-9]+\.[0-9]+-devel$' || true)
          sudo dnf install -y "$pkg" "$pkg-rubygems" "$pkg-rubygem-bundler" "$pkg-devel"
          for link in /usr/local/bin/*; do
            [ -L "$link" ] || continue
            case "$(readlink "$link")" in
              /opt/hostedtoolcache/Ruby/*) sudo rm -f "$link" ;;
            esac
          done
          sudo rm -f /usr/local/bin/ruby /usr/local/bin/gem /usr/local/bin/bundle /usr/local/bin/bundler
          sudo ln -sf "/usr/bin/$pkg" /usr/local/bin/ruby
          sudo ln -sf "/usr/bin/$pkg-gem" /usr/local/bin/gem
          sudo ln -sf "/usr/bin/$pkg-bundle" /usr/local/bin/bundle
          sudo ln -sf "/usr/bin/$pkg-bundler" /usr/local/bin/bundler
        else
          echo "Setup Ruby supports Ubuntu and Amazon Linux 2023" >&2
          exit 1
        fi
        ruby_bin="$(/usr/local/bin/ruby -e 'print Gem.bindir')"
        printf 'export PATH="%s:$PATH"\n' "$ruby_bin" | sudo tee /etc/profile.d/ravion-ruby.sh >/dev/null
        sudo rm -f "$index"
        actual="$(/usr/local/bin/ruby -e 'print RUBY_VERSION')"
        case "$actual" in
          "$R"|"$R".*)
            /usr/local/bin/gem --version >/dev/null
            /usr/local/bin/bundle --version >/dev/null
            ;;
          *) echo "Installed $actual but $R was requested" >&2; exit 1 ;;
        esac
        if [ -n "$old_dir_to_remove" ]; then
          sudo rm -rf "$old_dir_to_remove"
        fi

instructions: []
